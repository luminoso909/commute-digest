[project]
name = "commute-digest"
version = "0.1.0"
description = "通勤晨报，DeepSeek 联网新闻、双语解读与邮件订阅"
requires-python = ">=3.11,<3.15"
dependencies = ["streamlit>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
  "/src/commute_digest/static/widget-latest.json",
  "/src/commute_digest/static/.widget-latest.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
